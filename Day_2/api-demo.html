<!DOCTYPE html>
<html>
<head>
    <title>API Demo</title>

    <style>
        body{
            font-family:Arial;
            padding:20px;
            background:#f5f5f5;
        }

        #loader{
            font-size:20px;
        }

        .container{
            display:flex;
            flex-wrap:wrap;
            gap:20px;
        }

        .card{
            width:250px;
            background:white;
            padding:15px;
            border-radius:10px;
            box-shadow:0 0 5px gray;
        }
    </style>
</head>

<body>

<h1>Users API Demo</h1>

<div id="loader">Loading...</div>

<div id="users" class="container"></div>

<script>

async function loadUsers(){

    try{

        const response = await fetch("https://jsonplaceholder.typicode.com/users");

        const users = await response.json();

        document.getElementById("loader").style.display="none";

        const container=document.getElementById("users");

        users.forEach(user=>{

            container.innerHTML+=`
            <div class="card">
                <h3>${user.name}</h3>
                <p>${user.email}</p>
                <p>${user.phone}</p>
            </div>
            `;

        });

    }

    catch(error){

        document.getElementById("loader").innerHTML="Failed to load data.";

        console.log(error);

    }

}

loadUsers();

</script>

</body>
</html>
